<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0a0e14" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!--
			Google Analytics. It is over half the weight of the page and no visitor needs it, so it
			waits: the script loads on the first sign of a visitor (a move, scroll, tap or key press),
			or five seconds after the page has loaded. The page view is queued here either way.
			The cost: someone who leaves sooner than that without touching the page is not counted.
		-->
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());
			gtag('config', 'G-E63W60ZT7G');

			{
				const signsOfLife = ['pointermove', 'pointerdown', 'keydown', 'scroll', 'touchstart'];
				let fallback;

				const loadAnalytics = () => {
					signsOfLife.forEach((type) => removeEventListener(type, loadAnalytics));
					clearTimeout(fallback);

					const script = document.createElement('script');
					script.async = true;
					script.src = 'https://www.googletagmanager.com/gtag/js?id=G-E63W60ZT7G';
					document.head.append(script);
				};

				signsOfLife.forEach((type) => addEventListener(type, loadAnalytics, { passive: true }));
				addEventListener('load', () => (fallback = setTimeout(loadAnalytics, 5000)), {
					once: true
				});
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
